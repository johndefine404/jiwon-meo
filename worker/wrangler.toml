# [Define404] 지원냥 (jiwon-meo) 워커 설정
name = "jiwon-meo"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 첫 화면, 구독 확인, 조건 바꾸기, 수신 거부 화면
[assets]
directory = "../public"
not_found_handling = "404-page"
# 브라우저로 직접 연 /api, /dev 주소도 404 화면이 아니라 워커가 받게 한다
run_worker_first = ["/api/*", "/dev/*"]

# 구독자, 조건, 공고, 발송 기록
# 배포 전에: npx wrangler d1 create jiwon-meo  ->  나온 database_id 를 아래에 넣는다
[[d1_databases]]
binding = "DB"
database_name = "jiwon-meo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 공고 한 줄 요약 (USE_AI_SUMMARY = "1" 일 때만 호출)
[ai]
binding = "AI"

# 접속자 한 명당 1분에 10번까지 (구독·링크 요청)
[[ratelimits]]
name = "LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

# 매주 월요일 00:00 UTC = 한국 시간 월요일 09:00 (주간 발송)
# 매일 18:00 UTC = 한국 시간 03:00 (확인하지 않은 신청 정리만. 메일은 보내지 않는다)
[triggers]
crons = ["0 0 * * MON", "0 18 * * *"]

[vars]
PUBLIC_URL = "http://localhost:8787"
MAIL_FROM = "지원냥 <onboarding@resend.dev>"
SENDER_INFO = "Define404 (john@define404.com)"
CONTACT_URL = "https://contact.define404.com"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
USE_AI_SUMMARY = "0"
MOCK = "0"
